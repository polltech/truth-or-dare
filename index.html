<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white">
    <div class="absolute top-0 left-0 p-4">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Flag_of_Kenya.svg/1200px-Flag_of_Kenya.svg.png" alt="Kenya Flag" class="h-12">
    </div>
    <div id="intro-screen" class="container mx-auto p-4 text-center mt-20">
        <h1 class="text-4xl font-bold mb-4 text-red-600">🔥 Karibu! Welcome to the Ultimate Truth or Dare Game!</h1>
        <p class="text-blue-800 mb-4">Ready for some fun? Enter your name to get started!</p>
        <input type="text" id="player-name" placeholder="Enter Player Name (optional)" class="p-2 border-2 border-blue-800 rounded mb-4 w-1/2">
        <button id="start-game" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded btn">
            Let's Go!
        </button>
    </div>

    <div id="game-screen" class="container mx-auto p-4 text-center hidden mt-10">
        <div id="question-category" class="text-lg font-bold mb-2 text-blue-800"></div>
        <div id="question-text" class="text-2xl mb-4 p-6 bg-gray-100 rounded-lg min-h-[100px] flex items-center justify-center"></div>
        <div class="flex justify-center space-x-4">
            <button id="truth-btn" class="bg-blue-600 hover:bg-blue-800 text-white font-bold py-3 px-6 rounded-full btn text-xl">
                Truth ❓
            </button>
            <button id="dare-btn" class="bg-red-600 hover:bg-red-800 text-white font-bold py-3 px-6 rounded-full btn text-xl">
                Dare 😈
            </button>
        </div>
        <div class="mt-6">
            <button id="next-btn" class="bg-gray-700 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded btn">
                Next 🎯
            </button>
            <button id="share-btn" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded btn">
                Share on WhatsApp 💬
            </button>
        </div>
        <div class="mt-6">
            <button id="romantic-lock" class="bg-pink-500 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded btn">
                Romantic 🔞 (Hold 3s to Unlock)
            </button>
        </div>
    </div>
    <canvas id="confetti-canvas" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
