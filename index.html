<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Truth or Dare</h1>
        </header>

        <div id="menu-screen">
            <button id="start-game-menu">Start Game</button>
        </div>

        <div id="game-screen" style="display: none;">
            <div id="question-card">
                <div id="question-category"></div>
                <div id="question-text">Choose Truth, Dare, or Random!</div>
            </div>

            <div class="buttons-container">
                <button id="truth-btn" class="btn">Truth</button>
                <button id="dare-btn" class="btn">Dare</button>
                <button id="random-btn" class="btn">Random</button>
            </div>

            <div class="secondary-buttons">
                <button id="share-btn" class="secondary-btn">Share</button>
            </div>
        </div>
    </div>

    <button id="theme-toggle">🌙</button>

    <script src="prompts/truths.js"></script>
    <script src="prompts/dares.js"></script>
    <script src="script.js"></script>
</body>
</html>
